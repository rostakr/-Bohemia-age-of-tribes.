name: Apply storehouse admission patch

on:
  push:
    branches:
      - phase1/storehouse-textured-admission
    paths:
      - '.github/workflows/apply-storehouse-admission.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/storehouse-textured-admission
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply deterministic admission patch
        run: node scripts/apply-storehouse-admission.mjs
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/benchmark-scene.ts scripts/browser-phase1-smoke.mjs package.json scripts/apply-storehouse-admission.mjs
          git commit -m "Phase 1: admit textured storehouse WIP candidate"
          git push origin HEAD:phase1/storehouse-textured-admission
