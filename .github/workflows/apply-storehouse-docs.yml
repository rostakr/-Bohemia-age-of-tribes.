name: Apply storehouse QA docs

on:
  push:
    branches:
      - qa/supplied-content-reconcile
    paths:
      - scripts/patch-supplied-storehouse-docs.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/supplied-content-reconcile
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply exact documentation patch
        run: node scripts/patch-supplied-storehouse-docs.mjs
      - name: Commit documentation result
        shell: bash
        run: |
          rm scripts/patch-supplied-storehouse-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ASSET_MANIFEST.md docs/PROJECT_STATE.md docs/qa/SUPPLIED_STOREHOUSE_QA.md scripts/patch-supplied-storehouse-docs.mjs
          git diff --cached --check
          git commit -m "docs: record supplied storehouse QA admission"
          git push origin HEAD:qa/supplied-content-reconcile
