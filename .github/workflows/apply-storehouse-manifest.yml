name: Apply storehouse manifest update

on:
  push:
    branches:
      - phase1/storehouse-textured-admission
    paths:
      - '.github/workflows/apply-storehouse-manifest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/storehouse-textured-admission
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Update asset manifest
        run: node scripts/apply-storehouse-manifest.mjs
      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ASSET_MANIFEST.md scripts/apply-storehouse-manifest.mjs
          git commit -m "docs: record textured storehouse admission"
          git push origin HEAD:phase1/storehouse-textured-admission
