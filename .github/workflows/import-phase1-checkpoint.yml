name: Import unpacked Phase 1 checkpoint
on:
  push:
    branches: [integrate/phase1-checkpoint]
    paths: [.github/workflows/import-phase1-checkpoint.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/phase1-checkpoint
          fetch-depth: 0
      - name: Download unpacked binary assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://58a47152-17d2-4132-86a4-f5914318eb2a.sandbox.floot.app'
          fetch() { mkdir -p "$(dirname "$2")"; curl -fL --retry 3 --retry-delay 2 "$base$1" -o "$2"; }
          fetch '/_cdn/static/72f5c3c5-ca90-4963-8467-2c3e6dda2c92-boii-dwelling-concept.png' 'assets/source/phase1/boii-dwelling-concept.png'
          fetch '/_cdn/static/66c120cd-104f-47cb-8951-a44ef457776a-boii_dwelling_rectangular.glb' 'public/assets/buildings/boii_dwelling_rectangular.glb'
          fetch '/_cdn/static/528f38b9-81a0-4e9c-8922-3114a366815c-brown_mud_02_diff_1k.jpg' 'public/assets/materials/terrain/brown_mud_02_diff_1k.jpg'
          fetch '/_cdn/static/ad88594d-760c-4762-9fdc-e77e09d843e9-brown_mud_02_nor_gl_1k.jpg' 'public/assets/materials/terrain/brown_mud_02_nor_gl_1k.jpg'
          fetch '/_cdn/static/6a164572-6730-4f81-8dba-b1118de4cbc6-brown_mud_02_rough_1k.jpg' 'public/assets/materials/terrain/brown_mud_02_rough_1k.jpg'
          fetch '/_cdn/static/80b779fc-6478-4ce0-b587-d787ccf2b2d9-forest_ground_04_diff_1k.jpg' 'public/assets/materials/terrain/forest_ground_04_diff_1k.jpg'
          fetch '/_cdn/static/2be4939e-8607-48bf-aeea-0a25f9255f55-forest_ground_04_nor_gl_1k.jpg' 'public/assets/materials/terrain/forest_ground_04_nor_gl_1k.jpg'
          fetch '/_cdn/static/72b33f0e-db41-4565-bf96-9feb08f84cdf-forest_ground_04_rough_1k.jpg' 'public/assets/materials/terrain/forest_ground_04_rough_1k.jpg'
          fetch '/_cdn/static/c91b27dc-e4fa-45dd-be41-b5ef63d51834-grass_path_2_diff_1k.jpg' 'public/assets/materials/terrain/grass_path_2_diff_1k.jpg'
          fetch '/_cdn/static/9e7549d2-2782-4b99-9aae-167fc0aae233-grass_path_2_nor_gl_1k.jpg' 'public/assets/materials/terrain/grass_path_2_nor_gl_1k.jpg'
          fetch '/_cdn/static/b9a30ef0-2129-4412-9b74-b6b475749b9c-grass_path_2_rough_1k.jpg' 'public/assets/materials/terrain/grass_path_2_rough_1k.jpg'
      - name: Verify checkpoint asset hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase1.sha256 <<'EOF'
          11203eeb9b4c59a040f337635a78cdd634ad7ed0876a73ce079e545377f57b92  assets/source/phase1/boii-dwelling-concept.png
          faa41587ee4631017dc0cf8abdaceb06a4b7ef93996c4914458b5ed80c9382aa  public/assets/buildings/boii_dwelling_rectangular.glb
          058b6f12493305ec6b47cb5ea77f013c9e7e58216b34af3700a3d3d7d821732d  public/assets/materials/terrain/brown_mud_02_diff_1k.jpg
          9ca6f68d25599c98ba5e594df221f5653d93faceda1ba26a0babb1143e8c615f  public/assets/materials/terrain/brown_mud_02_nor_gl_1k.jpg
          c6d5891f090554c8f51172b2c4056f490ab1ed1a69127f1f876f9d58c46f0f23  public/assets/materials/terrain/brown_mud_02_rough_1k.jpg
          50a4dda30875020c64385261aa7e00e2155b592302fa6794165f58fae73cbd2c  public/assets/materials/terrain/forest_ground_04_diff_1k.jpg
          9c3a0200e02ce40edffbbf9f5f623ef08ea9b1b7812b556182ec978f88887151  public/assets/materials/terrain/forest_ground_04_nor_gl_1k.jpg
          89d4d50395eb92824a64132c4bc8a5a09009071e0b325ab66dc3104c7a3090ed  public/assets/materials/terrain/forest_ground_04_rough_1k.jpg
          7f30b163739435c11f500f3818c7bb4922bab5f2734cc9ba6dd36817f0c9a8ab  public/assets/materials/terrain/grass_path_2_diff_1k.jpg
          4f6e911619d4c79a6bc340a64eac1e5fcbae8e54ea2674ed1892f6a9a1dfb5fa  public/assets/materials/terrain/grass_path_2_nor_gl_1k.jpg
          2aaf4400e7892d643a4f64d7347f2a0ca65051b5cb0c1b5d0ef383a65a5fa172  public/assets/materials/terrain/grass_path_2_rough_1k.jpg
          EOF
          sha256sum -c /tmp/phase1.sha256
      - name: Preserve Phase 0 browser regression URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-smoke.mjs')
          s=p.read_text()
          s=s.replace("'?renderer=webgl2&debug=1'", "'?scene=calibration&renderer=webgl2&debug=1'")
          s=s.replace("'?debug=1'", "'?scene=calibration&debug=1'")
          p.write_text(s)
          p=Path('scripts/browser-interactions.mjs')
          p.write_text(p.read_text().replace('/?renderer=webgl2&debug=1','/?scene=calibration&renderer=webgl2&debug=1'))
          p=Path('scripts/browser-webgpu-smoke.mjs')
          p.write_text(p.read_text().replace('/?debug=1','/?scene=calibration&debug=1'))
          PY
      - name: Commit unpacked checkpoint files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/phase1/boii-dwelling-concept.png public/assets scripts/browser-smoke.mjs scripts/browser-interactions.mjs scripts/browser-webgpu-smoke.mjs
          git commit -m 'feat: import unpacked Phase 1 checkpoint assets'
          git push origin HEAD:integrate/phase1-checkpoint
