name: QA reconcile supplied storehouse

on:
  push:
    branches:
      - qa/supplied-content-reconcile
    paths:
      - '.github/workflows/qa-storehouse-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/supplied-content-reconcile
      - name: Apply exact storehouse-only runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          benchmark = Path('src/render/benchmark-scene.ts')
          text = benchmark.read_text()
          old = "  storehouse: null,\n"
          new = "  storehouse: SUPPLIED_STOREHOUSE_PATH,\n"
          assert text.count(old) == 1, f'expected exactly one null storehouse slot, got {text.count(old)}'
          text = text.replace(old, new, 1)
          benchmark.write_text(text)

          smoke = Path('scripts/browser-phase1-smoke.mjs')
          text = smoke.read_text()
          old_healthy = "diagnostics.storehouseCandidate === 'procedural-project-owned'"
          old_final = "diagnostics?.storehouseCandidate !== 'procedural-project-owned'"
          assert text.count(old_healthy) == 1, f'healthy storehouse assertion count={text.count(old_healthy)}'
          assert text.count(old_final) == 1, f'final storehouse assertion count={text.count(old_final)}'
          text = text.replace(old_healthy, "diagnostics.storehouseCandidate === 'project-owned-glb'", 1)
          text = text.replace(old_final, "diagnostics?.storehouseCandidate !== 'project-owned-glb'", 1)
          smoke.write_text(text)
          PY
      - name: Commit storehouse-only reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/benchmark-scene.ts scripts/browser-phase1-smoke.mjs
          git diff --cached --check
          git diff --cached
          git commit -m "qa: admit supplied textured storehouse for runtime review"
          git push origin HEAD:qa/supplied-content-reconcile
