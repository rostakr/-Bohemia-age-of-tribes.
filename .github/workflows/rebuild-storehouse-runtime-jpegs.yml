name: Rebuild storehouse runtime JPEG derivatives

on:
  pull_request:
    paths:
      - '.github/workflows/rebuild-storehouse-runtime-jpegs.yml'
  workflow_dispatch:

jobs:
  rebuild-storehouse-runtime-jpegs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install documented encoder
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Rebuild 512px runtime base colors from original PNG sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          root = Path('assets/source/phase1/materials')
          out = root / 'runtime-rebuilt'
          out.mkdir(parents=True, exist_ok=True)
          names = [
              'weathered-oak-basecolor',
              'straw-thatch-basecolor',
              'clay-daub-basecolor',
          ]
          records = []
          for stem in names:
              source = root / f'{stem}.png'
              target = out / f'{stem}-runtime-512.jpg'
              with Image.open(source) as image:
                  image.convert('RGB').resize((512, 512), Image.Resampling.LANCZOS).save(
                      target,
                      format='JPEG',
                      quality=90,
                      subsampling=0,
                      optimize=True,
                      progressive=True,
                  )
              payload = target.read_bytes()
              records.append({
                  'file': target.name,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          receipt = {'pillow': Image.__version__, 'settings': {'size': [512, 512], 'resampling': 'LANCZOS', 'quality': 90, 'subsampling': 0, 'optimize': True, 'progressive': True}, 'files': records}
          (out / 'rebuild-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Require historical documented hashes
        shell: bash
        run: |
          test "$(sha256sum assets/source/phase1/materials/runtime-rebuilt/weathered-oak-basecolor-runtime-512.jpg | cut -d' ' -f1)" = "c6abab6dd1959b80929657ffeda3a2425d6f3d965ae4d7f46ea45d774d1e8684"
          test "$(sha256sum assets/source/phase1/materials/runtime-rebuilt/straw-thatch-basecolor-runtime-512.jpg | cut -d' ' -f1)" = "0564f253d920fcdb6bc2e300687abe067912991b53e0e9fa72abdd1c7e5a8f0a"
          test "$(sha256sum assets/source/phase1/materials/runtime-rebuilt/clay-daub-basecolor-runtime-512.jpg | cut -d' ' -f1)" = "dc10ae700c143796fda36947149a4a47299b6e36a8f4cb1b2b3dd4b9c3f67ede"
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-storehouse-runtime-jpegs
          path: assets/source/phase1/materials/runtime-rebuilt/
          if-no-files-found: error
          retention-days: 1
