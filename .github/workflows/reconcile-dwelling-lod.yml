name: Reconcile dwelling LOD

on:
  push:
    branches:
      - phase1/dwelling-lod-reconciled

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[reconcile-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reconciliation patch
        run: node scripts/reconcile-dwelling-lod.mjs
      - name: Commit generated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json src/render/benchmark-scene.ts scripts/browser-phase1-smoke.mjs docs/ASSET_MANIFEST.md
          git diff --cached --check
          git commit -m "feat: reconcile dwelling LOD pipeline onto current Phase 1 [reconcile-generated]"
          git push origin HEAD:phase1/dwelling-lod-reconciled
