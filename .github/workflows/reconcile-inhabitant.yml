name: Reconcile inhabitant prototype

on:
  push:
    branches:
      - phase1/inhabitant-reconciled

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[reconcile-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reconciliation patch
        run: node scripts/reconcile-inhabitant.mjs
      - name: Commit generated reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/benchmark-scene.ts package.json scripts/browser-phase1-smoke.mjs index.html docs/ASSET_MANIFEST.md assets/source/phase1/inhabitant-study-receipt.json
          git diff --cached --check
          git commit -m "feat: reconcile inhabitant prototype onto current Phase 1 [reconcile-generated]"
          git push origin HEAD:phase1/inhabitant-reconciled
