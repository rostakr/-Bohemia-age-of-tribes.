name: Validate Phase 2 RTS interaction foundation
on:
  pull_request:
    branches:
      - qa/phase2-integration
    paths:
      - 'src/core/navigation-grid.ts'
      - 'src/core/rts-simulation.ts'
      - 'src/render/inspection-camera.ts'
      - 'src/render/rts-*.ts'
      - 'src/main.ts'
      - 'src/style.css'
      - 'scripts/check-phase2.mjs'
      - 'scripts/browser-phase2-smoke.mjs'
      - 'package.json'
      - '.github/workflows/validate-phase2-rts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase2-rts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Rebuild accepted Phase 1 worker/workshop inputs
        run: |
          node scripts/build-worker-r2.mjs
          node scripts/compact-worker-r2.mjs
          node --experimental-strip-types scripts/export-workshop-project.mjs
      - name: Full repository validation
        run: npm run validate
      - name: Phase 2 WebGL2 interaction smoke
        run: npm run smoke:phase2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-rts-interaction-evidence
          path: |
            artifacts/phase2/phase2-five-unit-webgl2.png
            artifacts/phase2/phase2-40-unit-webgl2.png
          if-no-files-found: error
          retention-days: 14
