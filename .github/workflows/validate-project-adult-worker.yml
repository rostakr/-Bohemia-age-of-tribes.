name: Validate project adult worker R2 candidate

on:
  pull_request:
    paths:
      - 'assets/source/phase1/worker/**'
      - 'scripts/check-project-adult-worker.mjs'
      - 'scripts/export-project-adult-worker.mjs'
      - 'scripts/browser-project-worker-smoke.mjs'
      - 'scripts/browser-project-worker-closeup.mjs'
      - 'src/main.ts'
      - 'src/render/worker-preview-scene.ts'
      - '.github/workflows/validate-project-adult-worker.yml'
  workflow_dispatch:

jobs:
  validate-project-adult-worker-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate deterministic R2 worker geometry
        run: node --experimental-strip-types --test scripts/check-project-adult-worker.mjs
      - name: Export final R2 worker GLB and 2K atlas
        run: node --experimental-strip-types scripts/export-project-adult-worker.mjs
      - name: Strict-check final R2 worker GLB
        run: node scripts/check-glb.mjs public/assets/characters/boii_adult_worker_project.glb --min-tris 25000 --max-tris 50000 --require-normals --require-uv0
      - name: Record deterministic file evidence
        run: |
          wc -c public/assets/characters/boii_adult_worker_project.glb
          sha256sum public/assets/characters/boii_adult_worker_project.glb
          wc -c artifacts/phase1/worker-adult-basecolor-2048.png
          sha256sum artifacts/phase1/worker-adult-basecolor-2048.png
      - name: Build with generated R2 worker preview asset
        run: npm run build
      - name: Isolated PlayCanvas R2 worker RTS smoke
        run: node scripts/browser-project-worker-smoke.mjs
      - name: Isolated PlayCanvas R2 worker close-up
        run: node scripts/browser-project-worker-closeup.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: project-adult-worker-r2-candidate
          path: |
            public/assets/characters/boii_adult_worker_project.glb
            artifacts/phase1/worker-adult-basecolor-2048.png
            artifacts/phase1/project-worker-webgl2-1920x1080.png
            artifacts/phase1/project-worker-closeup-webgl2-1200x1200.png
            assets/source/phase1/worker-project-glb-receipt.json
          if-no-files-found: error
          retention-days: 7
