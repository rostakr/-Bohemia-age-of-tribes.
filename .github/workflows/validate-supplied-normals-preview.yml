name: Validate supplied normals preview

on:
  pull_request:
    paths:
      - '.github/workflows/validate-supplied-normals-preview.yml'
      - 'assets/source/phase1/user-supplied/**'
      - 'scripts/add-glb-normals.mjs'
      - 'scripts/check-glb.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate normals-only QA preview copies
        run: |
          node scripts/add-glb-normals.mjs \
            assets/source/phase1/user-supplied/boii_carpentry_shed_open.original.glb \
            public/assets/buildings/boii_carpentry_shed_open_qa_preview.glb
          node scripts/add-glb-normals.mjs \
            assets/source/phase1/user-supplied/boii_adult_worker.original.glb \
            public/assets/characters/boii_adult_worker_qa_preview.glb
      - name: Strict-check preview GLBs
        run: |
          node scripts/check-glb.mjs \
            public/assets/buildings/boii_carpentry_shed_open_qa_preview.glb \
            --min-tris 89000 --max-tris 91000 --require-normals --require-uv0
          node scripts/check-glb.mjs \
            public/assets/characters/boii_adult_worker_qa_preview.glb \
            --min-tris 14000 --max-tris 14500 --require-normals --require-uv0
      - name: Record deterministic file evidence
        run: |
          wc -c public/assets/buildings/boii_carpentry_shed_open_qa_preview.glb
          sha256sum public/assets/buildings/boii_carpentry_shed_open_qa_preview.glb
          wc -c public/assets/characters/boii_adult_worker_qa_preview.glb
          sha256sum public/assets/characters/boii_adult_worker_qa_preview.glb
      - uses: actions/upload-artifact@v4
        with:
          name: supplied-normals-preview-glbs
          path: |
            public/assets/buildings/boii_carpentry_shed_open_qa_preview.glb
            public/assets/characters/boii_adult_worker_qa_preview.glb
          retention-days: 7
