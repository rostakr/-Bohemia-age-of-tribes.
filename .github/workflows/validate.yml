name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Phase 0 WebGL2 browser smoke
        run: npm run smoke:webgl2
      - name: Phase 0 interaction smoke
        run: npm run smoke:interactions
      - name: Lifecycle remount smoke
        run: npm run smoke:lifecycle
      - name: Phase 0 software WebGPU smoke
        run: npm run smoke:webgpu
      - name: Phase 1 benchmark browser smoke
        run: npm run smoke:phase1
      - name: Supplied storehouse admission smoke
        run: npm run smoke:supplied-storehouse
      - name: Supplied storehouse close-up smoke
        run: npm run smoke:supplied-storehouse-closeup
      - name: P4-VIS-01 targeted worker cycle
        run: npm run smoke:phase4
      - uses: actions/upload-artifact@v4
        with:
          name: bohemia-static-build
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-webgl2-evidence
          path: artifacts/phase0-webgl2-1920x1080.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-browser-evidence
          path: artifacts/phase1/phase1-webgl2-1920x1080.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplied-storehouse-browser-evidence
          path: |
            artifacts/phase1/supplied-storehouse-webgl2-1920x1080.png
            artifacts/phase1/supplied-storehouse-closeup-1920x1080.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-worker-cycle-evidence
          path: artifacts/phase4/*.png
          if-no-files-found: warn
          retention-days: 7
