name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Phase 0 WebGL2 browser smoke
        run: npm run smoke:webgl2
      - name: Phase 0 interaction smoke
        run: npm run smoke:interactions
      - name: Phase 0 software WebGPU smoke
        run: npm run smoke:webgpu
      - name: Phase 1 benchmark browser smoke
        run: npm run smoke:phase1
      - uses: actions/upload-artifact@v4
        with:
          name: bohemia-static-build
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-webgl2-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
